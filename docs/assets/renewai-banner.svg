<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">RenewAI — Contract renewal intelligence</title>
  <desc id="description">Know what renews. Know when to act. A blue renewal arrow beside the RenewAI name on a dark navy background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1223"/><stop offset="1" stop-color="#142b50"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <g fill="none" stroke="#60a5fa" stroke-opacity=".1">
    <circle cx="1100" cy="165" r="110"/><circle cx="1100" cy="165" r="190"/><circle cx="1100" cy="165" r="270"/>
  </g>
  <rect x="68" y="71" width="70" height="70" rx="19" fill="#1d4ed8" fill-opacity=".25" stroke="#60a5fa" stroke-opacity=".35"/>
  <path d="M119 103a20 20 0 1 0 1 14M119 103v-13m0 13h-13" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="160" y="125" font-size="58" font-weight="700" letter-spacing="-2" fill="#f8fafc">Renew<tspan fill="#7dd3fc">AI</tspan></text>
    <text x="70" y="194" font-size="29" font-weight="600" fill="#e2e8f0">Contract renewal intelligence</text>
    <text x="70" y="239" font-size="22" fill="#94a3b8">Know what renews. Know when to act.</text>
    <rect x="989" y="58" width="143" height="33" rx="16" fill="#1e3a5f"/>
    <circle cx="1008" cy="74" r="4" fill="#7dd3fc"/>
    <text x="1020" y="80" font-size="14" fill="#bae6fd">PRIVATE BETA</text>
